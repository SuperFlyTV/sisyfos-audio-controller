name: Dev Node CI

permissions:
    contents: read
    packages: write

env:
    node-version: 24
    yarn-version: 4.1.0

on:
    push:
        branches:
            - 'develop'
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
    workflow_dispatch:

jobs:
    cache-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Access repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

            - name: Copy Shared Package
              run: |
                  cp -r shared server/node_modules/

    test:
        runs-on: ubuntu-latest
        needs: cache-dependencies
        steps:
            - name: Access repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - uses: ./.github/actions/test

    validate-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Access repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - uses: ./.github/actions/validate-dependencies

    build:
        runs-on: ubuntu-latest
        needs:
            - test
            - validate-dependencies
        steps:
            - name: Access repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

            - name: Build
              run: yarn build

            - name: Upload client build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-client-develop
                  path: client/dist

            - name: Upload server build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-server-develop
                  path: server/dist

    publish-container-image:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Create the image tags
              id: image-tag
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  provenance: false
                  labels: ${{ steps.image-tag.outputs.labels }}
                  tags: ${{ steps.image-tag.outputs.tags }}
