#######################################################################################################################
#
#   Dev / Test Image Publish
#
#   Manual workflow_dispatch. Builds and publishes a container image for any branch.
#   Image tag: {sanitized-branch}-{short-sha}
#
#######################################################################################################################
name: Dev Node CI

permissions:
    contents: read
    packages: write

env:
    node-version: 24
    yarn-version: 4.1.0

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to build and publish'
                required: true
                type: string

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.tag.outputs.image_tag }}
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.branch }}

            - name: Compute image tag
              id: tag
              run: |
                  SAFE_BRANCH=$(echo "${{ inputs.branch }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
                  SHORT_SHA=$(git rev-parse --short=7 HEAD)
                  echo "image_tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

            - name: Build
              run: yarn build

    publish-container-image:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.branch }}
                  persist-credentials: false

            - name: Compute image tag
              id: tag
              run: |
                  SAFE_BRANCH=$(echo "${{ inputs.branch }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
                  SHORT_SHA=$(git rev-parse --short=7 HEAD)
                  echo "image_tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

            - name: Create the image tags
              id: image-tag
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=${{ steps.tag.outputs.image_tag }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  provenance: false
                  labels: ${{ steps.image-tag.outputs.labels }}
                  tags: ${{ steps.image-tag.outputs.tags }}

            - name: Report published image
              run: |
                  echo "Published ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.image_tag }}"
