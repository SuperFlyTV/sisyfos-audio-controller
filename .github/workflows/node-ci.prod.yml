#######################################################################################################################
#
#   Node CI - Production
#
#   The workflow ensures quality for the build, builds the project and publishes it to the configured destinations.
#   There are the following destinations:
#
#   [Github Release]
#     The destination is only triggered if the secret 'RELEASE_TO_GITHUB' is set to a non-empty value.
#
#   [GHCR]
#     Container images are published to ghcr.io/Sofie-Automation/sisyfos-audio-controller.
#
#######################################################################################################################
name: Prod Node CI

permissions:
    contents: write
    packages: write
    id-token: write

env:
    node-version: 24
    yarn-version: 4.1.0

on:
    push:
        branches:
            - 'master'
            - 'main'
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
    workflow_dispatch:

jobs:
    cache-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

    prebuild:
        runs-on: ubuntu-latest
        needs: cache-dependencies
        steps:
            - name: Access repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

            - name: Build
              run: yarn build

    test:
        runs-on: ubuntu-latest
        needs: cache-dependencies
        steps:
            - name: Access repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - uses: ./.github/actions/test

    validate-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Access repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - uses: ./.github/actions/validate-dependencies

    bump-version:
        if: github.ref_type == 'branch'
        runs-on: ubuntu-latest
        needs:
            - prebuild
            - test
            - validate-dependencies
        outputs:
            tag_version: ${{ steps.tag_version.outputs.new_tag || steps.tag_version.outputs.previous_tag }}
            version: ${{ steps.tag_version.outputs.new_version || steps.tag_version.outputs.previous_version }}
            changelog: ${{ steps.tag_version.outputs.changelog }}
            bumped: ${{ steps.tag_version.outputs.new_tag != '' }}
            commit_sha: ${{ steps.commit_sha.outputs.commit_sha }}
        steps:
            - name: Access repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Configure committer
              run: |
                  git config user.name "${{ github.event.pusher.name }}"
                  git config user.email "${{ github.event.pusher.email }}"
            - name: Bump version and push tag
              id: tag_version
              uses: mathieudutour/github-tag-action@v6.1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  default_bump: false
            - name: Update package.json
              if: steps.tag_version.outputs.new_tag != ''
              uses: jossef/action-set-json-field@v2.1
              with:
                  file: package.json
                  field: version
                  value: ${{ steps.tag_version.outputs.new_version }}
            - name: Update CHANGELOG.md
              env:
                  changes: ${{ steps.tag_version.outputs.changelog }}
              run: |
                  echo "$changes" > /tmp/tmp-changelog.md
                  [ -f CHANGELOG.md ] && cat CHANGELOG.md >> /tmp/tmp-changelog.md
                  mv /tmp/tmp-changelog.md CHANGELOG.md

            - name: Commit and push changes to package.json and CHANGELOG.md
              id: commit_sha
              if: steps.tag_version.outputs.new_tag != ''
              uses: EndBug/add-and-commit@v9
              with:
                  add: "['package.json', 'CHANGELOG.md']"

    create-pull-request-develop:
        runs-on: ubuntu-latest
        if: needs.bump-version.outputs.bumped == 'true'
        needs:
            - bump-version
        steps:
            - name: Access repository
              uses: actions/checkout@v4
            - name: Pull request to develop
              id: develop
              continue-on-error: true
              uses: repo-sync/pull-request@v2
              with:
                  destination_branch: 'develop'
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  pr_label: 'release, automated-pr'
                  pr_title: 'Release ${{ needs.bump-version.outputs.version }} -> develop'
            - name: Report status
              env:
                  report: ${{ toJSON(steps.develop.outcome) }} - ${{ toJSON(steps.develop.conclusion) }}
              run: echo $report

    build:
        if: always() && !failure() && !cancelled()
        runs-on: ubuntu-latest
        needs:
            - bump-version
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.bump-version.outputs.commit_sha || github.ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Ensure commits from bump-version
              if: needs.bump-version.outputs.commit_sha != ''
              run: git pull

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

            - name: Build
              run: yarn build

            - name: Upload client build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-client
                  path: client/dist

            - name: Upload server build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-server
                  path: server/dist

    build-desktop:
        runs-on: windows-latest
        needs:
            - bump-version
            - build
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.bump-version.outputs.commit_sha || github.ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Ensure commits from bump-version
              run: git pull

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - uses: actions/download-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-client
                  path: client/dist

            - uses: actions/download-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-server
                  path: server/dist

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

            - name: Build desktop
              run: yarn build:desktop

            - name: Upload desktop build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-desktop
                  path: desktop/dist

    check-github-release:
        runs-on: ubuntu-latest
        needs: build-desktop
        outputs:
            defined: ${{ steps.release.outputs.defined == 'true' }}
        steps:
            - name: Access repository
              uses: actions/checkout@v4
            - name: Check if is set to release
              id: release
              uses: ./.github/actions/check-secret
              with:
                  secret: ${{ secrets.RELEASE_TO_GITHUB }}

    publish-github-release:
        runs-on: ubuntu-latest
        if: needs.bump-version.outputs.bumped == 'true' && needs.check-github-release.outputs.defined == 'true'
        needs:
            - bump-version
            - check-github-release
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.bump-version.outputs.commit_sha }}
            - name: Ensure commits from bump-version
              run: git pull
            - uses: actions/download-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-desktop
                  path: desktop/dist
            - name: Compress artifact to zip
              uses: papeloto/action-zip@v1
              with:
                  files: dist
                  dest: '${{ github.event.repository.name }}-${{ needs.bump-version.outputs.version }}.zip'
            - name: Create Github release with desktop exe
              uses: softprops/action-gh-release@v1
              with:
                  name: Release ${{ needs.bump-version.outputs.tag_version }}
                  tag_name: ${{ needs.bump-version.outputs.tag_version }}
                  body: ${{ needs.bump-version.outputs.changelog }}
                  files: |
                      desktop/dist/*.exe
                      desktop/dist/*.dmg

    publish-container-image:
        if: always() && !failure() && !cancelled()
        needs:
            - bump-version
            - build
        permissions:
            contents: read
            packages: write
        uses: Sofie-Automation/sofie-github-workflows/.github/workflows/container-build-push.yml@main
        with:
            tags: |
                type=ref,event=branch
                type=ref,event=tag
                type=raw,value=latest,enable={{is_default_branch}}
                type=semver,pattern={{version}}
                type=semver,pattern={{major}}.{{minor}}
